name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new commit makes the in-flight run obsolete: cancel it instead of burning minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: unit tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # The suite runs in ~15 s with a fake ASR engine and the bundled Silero VAD; no model
    # downloads. Most of the wall clock is pip. 15 minutes kills a hung run fast.
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11']
        include:
          - os: ubuntu-latest
            python: '3.10'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # PortAudio is what sounddevice dlopens on Linux; the wheels bundle it on Windows/macOS.
      - name: Install PortAudio (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libportaudio2 > /dev/null

      - name: Install
        run: python -m pip install -q -e ".[test]"

      # -x stops at the first failure (fail fast).
      - name: Unit tests
        run: python -m pytest -q -x -p no:cacheprovider
